<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../CSS/bootStyle.css" />
    <title>Sorella Beauty - Login Administrador</title>
  </head>
  <body class="bg-light d-flex flex-column min-vh-100">
    <header>
      <nav
        class="navbar navbar-expand-md navbar-dark bg-dark sticky-top p-0"
        style="position: relative"
      >
        <div class="container">
          <a
            class="navbar-brand fw-bold p-0"
            href="../index.html"
            style="position: absolute; top: 5px; z-index: 1000"
          >
            <img
              src="../img/logo.jpg"
              alt="Sorella Beauty Tafi Viejo"
              class="rounded-circle shadow"
              style="height: 85px; width: 85px; object-fit: cover"
            />
          </a>

          <div style="width: 90px; height: 60px"></div>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navLinks"
            aria-controls="navLinks"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navLinks">
            <ul class="navbar-nav ms-auto mb-2 mb-md-0">
              <li class="nav-item">
                <a class="nav-link" href="../index.html">Volver al sitio</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main
      class="flex-grow-1 d-flex align-items-center justify-content-center py-5"
    >
      <div class="container" style="max-width: 400px">
        <div id="login-container" class="card border-0 shadow-sm p-4">
          <h2 class="text-primary text-center mb-4 h4 fw-bold">
            Acceso Administrador
          </h2>

          <form id="login-form">
            <div class="mb-3">
              <label for="usuario" class="form-label fw-bold">Usuario</label>
              <input
                type="text"
                id="user"
                name="user"
                class="form-control"
                required
                autocomplete="username"
              />
            </div>

            <div class="mb-3">
              <label for="password" class="form-label fw-bold"
                >ContraseÃ±a</label
              >
              <input
                type="password"
                id="password"
                name="password"
                class="form-control"
                required
                autocomplete="current-password"
              />
            </div>

            <div
              id="error-message"
              class="alert alert-danger py-2 mb-3"
              style="display: none"
              role="alert"
            ></div>

            <button type="submit" class="btn-turno btn btn-primary w-100">
              Ingresar
            </button>
          </form>
        </div>
      </div>
    </main>

    <footer class="bg-dark text-white text-center py-4 mt-auto">
      <p class="mb-0 small">
        &copy; 2026 Sorella Beauty. Todos los derechos reservados.
      </p>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="../js/login.js" defer></script>
  </body>
</html>
